[project]
name = "itera-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "lark>=1.3.1",
    "pydub>=0.25.1",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.14.0",
    "transformers>=5.20.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
itera-prompts = "itera_llm.teste_prompt:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
